<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Starry Abyss 鈥?background bake</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #030812; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="bake"></canvas>
<script src="art.js"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const themeIndex = parseInt(params.get("theme") || "0", 10) % StarArt.THEMES.length;
  const seed = parseInt(params.get("seed") || "92731", 10);
  const theme = StarArt.THEMES[themeIndex];

  const dpr = Math.min(window.devicePixelRatio || 1, 1);
  const w = window.innerWidth;
  const h = window.innerHeight;
  const canvas = document.getElementById("bake");
  canvas.width = Math.floor(w * dpr);
  canvas.height = Math.floor(h * dpr);
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const backdrop = StarArt.buildBackdrop(w, h, theme, seed);
  ctx.drawImage(backdrop.canvas, 0, 0, w, h);

  // Bake a richer second pass of luminous impasto over the sky.
  // The in-game living black hole and orbiting stars sit on top of this.
  enhance(ctx, theme, seed, w, h);

  if (params.get("preview") === "1") {
    preview(ctx, theme, w, h);
  }
  document.title = "ready";

  function preview(g, theme, w, h) {
    const S = Math.min(w, h);
    g.save();
    g.translate(w / 2, h / 2);
    StarArt.blackHole(g, {
      time: 7.2,
      radius: S * 0.068,
      theme,
      danger: 0,
      collapse: 0,
      grow: 0
    });
    g.restore();
    const portalAngle = -2.24;
    const portalDist = S * 0.442;
    g.save();
    StarArt.portal(g, {
      x: w / 2 + Math.cos(portalAngle) * portalDist,
      y: h / 2 + Math.sin(portalAngle) * portalDist,
      radius: S * 0.052,
      time: 4.4,
      theme,
      near: 0.15,
      flare: 0
    });
    g.restore();
    const fakeBodies = [
      { type: "star", x: w * 0.34, y: h * 0.37, size: S * 0.032, color: theme.star, trailColor: theme.cream, seed: 12, rot: 0, trail: [] },
      { type: "planet", x: w * 0.64, y: h * 0.39, size: S * 0.022, color: theme.planets[0], accent: theme.teals[1], seed: 31, rot: 0.3, trail: [], hasRing: true },
      { type: "planet", x: w * 0.59, y: h * 0.71, size: S * 0.017, color: theme.planets[2], accent: theme.golds[1], seed: 44, rot: 1.8, trail: [], hasRing: false },
      { type: "meteor", x: w * 0.41, y: h * 0.66, size: S * 0.009, color: theme.golds[0], seed: 66, rot: 1.2, trail: [] }
    ];
    fakeBodies.forEach((b) => StarArt.drawBody(g, b, 9.3, theme));
    // Player's star, near the lower-left.
    g.save();
    StarArt.drawPlayer(g, {
      x: w * 0.42,
      y: h * 0.66,
      vx: 0.5,
      vy: -0.2,
      angle: -0.5,
      radius: S * 0.019,
      mass: 74,
      trail: [
        { x: w * 0.38, y: h * 0.70 }, { x: w * 0.40, y: h * 0.68 }, { x: w * 0.42, y: h * 0.66 }
      ],
      trailColor: theme.star,
      collisionPulse: 0,
      steerVisual: 0.2
    }, 9.2, theme);
    g.restore();
  }

  function enhance(g, theme, seed, w, h) {
    const TAU = Math.PI * 2;
    const rng = (function (a) {
      return function () {
        a |= 0; a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    })(seed ^ 0x7f4a7c15);
    const S = Math.min(w, h);
    const cx = w / 2;
    const cy = h / 2;
    const pick = (arr) => arr[(rng() * arr.length) | 0];
    const hex = (c) => {
      if (c[0] === "#" && c.length === 7) return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
      return [255,255,255];
    };
    const rgba = (c, a) => { const p = hex(c); return `rgba(${p[0]},${p[1]},${p[2]},${a})`; };
    const dab = (x, y, ang, len, wid, color, alpha, bend) => {
      g.save();
      g.translate(x, y);
      g.rotate(ang);
      g.globalAlpha = alpha;
      g.strokeStyle = color;
      g.lineWidth = wid;
      g.lineCap = "round";
      g.beginPath();
      g.moveTo(-len / 2, 0);
      g.quadraticCurveTo(0, bend || 0, len / 2, 0);
      g.stroke();
      g.restore();
    };

    // Warm and cool pigment blooms, blended like varnished oil paint.
    g.save();
    g.globalCompositeOperation = "screen";
    const blooms = [
      { x: w * 0.15, y: h * 0.23, r: S * 0.47, c: theme.golds[1], a: 0.09 },
      { x: w * 0.82, y: h * 0.30, r: S * 0.42, c: theme.teals[2], a: 0.07 },
      { x: w * 0.58, y: h * 0.84, r: S * 0.5, c: theme.blues[2], a: 0.09 },
      { x: w * 0.85, y: h * 0.82, r: S * 0.34, c: theme.coral, a: 0.035 }
    ];
    blooms.forEach((b) => {
      const p = hex(b.c);
      const grad = g.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
      grad.addColorStop(0, `rgba(${p[0]},${p[1]},${p[2]},${b.a})`);
      grad.addColorStop(0.55, `rgba(${p[0]},${p[1]},${p[2]},${b.a * 0.24})`);
      grad.addColorStop(1, `rgba(${p[0]},${p[1]},${p[2]},0)`);
      g.fillStyle = grad;
      g.fillRect(b.x - b.r, b.y - b.r, b.r * 2, b.r * 2);
    });
    g.restore();

    // Strong, sweeping spiral currents 鈥?the signature of the night.
    g.save();
    g.globalCompositeOperation = "lighter";
    const bands = [
      { start: -2.7, dir: 1, turns: 2.0, r0: 0.13, grow: 0.24, color: theme.golds[1], count: 150, alpha: [0.065, 0.16] },
      { start: 0.55, dir: -1, turns: 1.75, r0: 0.18, grow: 0.27, color: theme.teals[2], count: 160, alpha: [0.045, 0.115] },
      { start: 2.35, dir: 1, turns: 2.3, r0: 0.2, grow: 0.3, color: theme.golds[2], count: 145, alpha: [0.04, 0.12] },
      { start: -0.9, dir: -1, turns: 1.55, r0: 0.26, grow: 0.24, color: theme.cream, count: 100, alpha: [0.03, 0.08] }
    ];
    bands.forEach((band, bi) => {
      for (let i = 0; i < band.count; i++) {
        const q = i / band.count;
        const a = band.start + band.dir * q * band.turns * TAU;
        const rad = S * (band.r0 + q * band.grow + Math.sin(q * 9 + bi) * 0.012);
        const x = cx + Math.cos(a) * rad * 1.06;
        const y = cy + Math.sin(a) * rad * 0.78;
        if (x < -80 || x > w + 80 || y < -80 || y > h + 80) continue;
        const len = 8 + rng() * 27;
        const wid = 1.1 + rng() * 3.3;
        const alpha = band.alpha[0] + rng() * (band.alpha[1] - band.alpha[0]);
        dab(x, y, a + Math.PI / 2 * band.dir + 0.08, len, wid, rgba(band.color, 0.8), alpha, (rng() - 0.5) * len * 0.24);
        if (rng() > 0.52) {
          dab(x + (rng() - 0.5) * 4, y + (rng() - 0.5) * 4, a + Math.PI / 2 * band.dir + 0.08, len * 0.6, wid * 0.7, rgba(theme.cream, 0.5), alpha * 0.4, (rng() - 0.5) * len * 0.2);
        }
      }
    });

    // Loose cross-currents and incandescent threads.
    for (let i = 0; i < 420; i++) {
      const x = rng() * w;
      const y = rng() * h;
      const dx = x - cx;
      const dy = y - cy;
      if (dx * dx + dy * dy < S * S * 0.055) continue;
      const a = Math.atan2(dy, dx) + Math.PI / 2 + (rng() - 0.5) * 0.48;
      const color = rng() < 0.48 ? theme.golds[1] : rng() < 0.75 ? theme.cream : theme.teals[1];
      dab(x, y, a, 4 + rng() * 20, 0.7 + rng() * 2, rgba(color, 0.85), 0.03 + rng() * 0.09, (rng() - 0.5) * 2);
    }
    g.restore();

    // Fine halos of gold around a few painted stars, echoing the moon.
    g.save();
    g.globalCompositeOperation = "lighter";
    for (let i = 0; i < 4; i++) {
      const a0 = rng() * TAU;
      const radius = S * (0.27 + i * 0.082);
      const a1 = a0 + 0.7 + rng() * 1.1;
      for (let j = 0; j < 3; j++) {
        g.strokeStyle = rgba(j % 2 ? theme.cream : theme.golds[1], 0.055 + rng() * 0.035);
        g.lineWidth = 0.55 + rng() * 0.8;
        g.beginPath();
        g.arc(cx, cy * 1.01, radius + j * 5, a0 + j * 0.06, a1 + j * 0.14);
        g.stroke();
      }
    }
    // A few bright pin-stars with tiny four-ray crosses.
    for (let i = 0; i < 48; i++) {
      const x = rng() * w;
      const y = rng() * h;
      if (Math.hypot(x - cx, y - cy) < S * 0.22) continue;
      const len = 2 + rng() * 9;
      const alpha = 0.08 + rng() * 0.28;
      g.strokeStyle = rgba(theme.cream, 0.6);
      g.lineWidth = 0.55;
      g.globalAlpha = alpha;
      g.beginPath();
      g.moveTo(x - len, y);
      g.lineTo(x + len, y);
      g.moveTo(x, y - len * 0.7);
      g.lineTo(x, y + len * 0.7);
      g.stroke();
      g.globalAlpha = 1;
    }
    g.restore();

    // The living wayfarer's gate sits at this exact normalized position in
    // the Unity camera. Give it a quiet pool of dark pigment so its golden
    // rings can breathe against the crowded upper-left sky.
    const gateY = h * 0.2225;
    const gx = w * 0.3362;
    const clearing = g.createRadialGradient(gx, gateY, 0, gx, gateY, S * 0.24);
    const ink = hex(theme.ink);
    clearing.addColorStop(0, `rgba(${ink[0]},${ink[1]},${ink[2]},0.58)`);
    clearing.addColorStop(0.34, `rgba(${ink[0]},${ink[1]},${ink[2]},0.34)`);
    clearing.addColorStop(0.72, `rgba(${ink[0]},${ink[1]},${ink[2]},0.1)`);
    clearing.addColorStop(1, `rgba(${ink[0]},${ink[1]},${ink[2]},0)`);
    g.save();
    g.globalCompositeOperation = "source-over";
    g.fillStyle = clearing;
    g.fillRect(gx - S * 0.25, gateY - S * 0.25, S * 0.5, S * 0.5);
    g.restore();

    // A quiet, warm veil at the threshold of the canvas.
    const edge = g.createLinearGradient(0, 0, w, 0);
    edge.addColorStop(0, rgba(theme.golds[1], 0.045));
    edge.addColorStop(0.35, rgba(theme.golds[1], 0));
    edge.addColorStop(0.78, rgba(theme.teals[1], 0.015));
    edge.addColorStop(1, rgba(theme.teals[1], 0.045));
    g.save();
    g.globalCompositeOperation = "screen";
    g.fillStyle = edge;
    g.fillRect(0, 0, w, h);
    g.restore();
  }
})();
</script>
</body>
</html>
