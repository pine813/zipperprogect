<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#05070a">
  <title>Zipper Demo</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #05070a;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none; touch-action: none;
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    #unity-container { position: fixed; inset: 0; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #05070a; touch-action: none; outline: none; }

    #loading {
      position: fixed; inset: 0; z-index: 10;
      display: flex; align-items: center; justify-content: center; flex-direction: column;
      background: radial-gradient(circle at 50% 40%, #0d1a2e 0%, #05070a 70%);
      color: #cfe6ff;
    }
    #loading .title { font-size: 26px; letter-spacing: 8px; font-weight: 600; color: #eaf4ff; }
    #loading .sub { margin-top: 10px; font-size: 12px; letter-spacing: 3px; opacity: .55; }
    #bar { width: min(62vw, 420px); height: 6px; margin-top: 26px; background: #121e31; border-radius: 3px; overflow: hidden; }
    #fill { height: 100%; width: 0%; background: linear-gradient(90deg, #3f9fe0, #9fe3ff); transition: width .2s ease; }
    #pct { margin-top: 10px; font-size: 13px; letter-spacing: 2px; opacity: .65; }

    #rotate {
      position: fixed; inset: 0; z-index: 20; display: none;
      align-items: center; justify-content: center; flex-direction: column;
      background: #05070a; color: #cfe6ff; text-align: center; padding: 24px;
    }
    #rotate .icon { font-size: 54px; margin-bottom: 14px; animation: rot 1.8s ease-in-out infinite; }
    #rotate .t { font-size: 19px; font-weight: 600; letter-spacing: 2px; }
    #rotate .s { margin-top: 10px; font-size: 13px; opacity: .6; line-height: 1.7; }
    #goLandscape {
      margin-top: 22px; padding: 12px 30px; border-radius: 26px; border: 1px solid #3f9fe0;
      background: rgba(63,159,224,.16); color: #d8efff; font-size: 15px; letter-spacing: 2px;
    }
    @keyframes rot { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(90deg); } }

    #err {
      position: fixed; inset: auto 12px 12px 12px; z-index: 40; display: none;
      background: rgba(120, 24, 24, .96); color: #fff; padding: 12px 14px; border-radius: 10px;
      font-size: 13px; line-height: 1.6; word-break: break-all;
    }
    #err b { color: #ffd7d7; }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" width=1280 height=720 tabindex="-1"></canvas>
  </div>

  <div id="loading">
    <div class="title">ZIPPER</div>
    <div class="sub">G A M E &nbsp; J A M &nbsp; D E M O</div>
    <div id="bar"><div id="fill"></div></div>
    <div id="pct">0%</div>
  </div>

  <div id="rotate">
    <div class="icon">&#128241;</div>
    <div class="t">横屏游玩</div>
    <div class="s">请把手机横过来<br>或点击下面按钮进入全屏横屏</div>
    <button id="goLandscape">横 屏 进 入</button>
  </div>

  <div id="err"></div>

  <script>
    var canvas = document.querySelector("#unity-canvas");
    var loading = document.querySelector("#loading");
    var fill = document.querySelector("#fill");
    var pct = document.querySelector("#pct");
    var rotateLayer = document.querySelector("#rotate");
    var errBox = document.querySelector("#err");
    var ua = navigator.userAgent;
    var isWeChat = /MicroMessenger/i.test(ua);
    var isIOS = /iPhone|iPad|iPod/i.test(ua);

    function showError(msg) {
      errBox.style.display = "block";
      errBox.innerHTML = "<b>无法运行：</b>" + msg +
        "<br><span style='opacity:.8'>" + (isWeChat
          ? "微信内置浏览器常拦截 WebGL —— 请点右上角「···」→「在浏览器中打开」"
          : "建议使用最新版 Chrome / Safari，并确认已开启硬件加速") + "</span>";
    }

    function isPortrait() { return window.innerHeight > window.innerWidth; }

    function updateOrientationUi() {
      rotateLayer.style.display = isPortrait() ? "flex" : "none";
    }
    window.addEventListener("resize", updateOrientationUi);
    window.addEventListener("orientationchange", function () { setTimeout(updateOrientationUi, 150); });
    updateOrientationUi();

    function goLandscape() {
      try {
        var el = document.documentElement;
        var req = el.requestFullscreen || el.webkitRequestFullscreen;
        if (req) {
          var p = req.call(el);
          if (p && p.catch) p.catch(function () { });
        }
      } catch (e) { }
      try {
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock("landscape").catch(function () { });
        }
      } catch (e) { }
      setTimeout(updateOrientationUi, 350);
    }

    document.querySelector("#goLandscape").addEventListener("click", function (e) {
      e.stopPropagation();
      goLandscape();
    });

    // 任意点击/触摸都尝试一次横屏（浏览器要求用户手势才允许全屏）
    document.addEventListener("pointerdown", function () {
      if (isPortrait()) goLandscape();
    }, true);

    // 进页面就尝试（部分安卓浏览器允许）
    window.addEventListener("load", function () { if (isPortrait()) goLandscape(); });

    window.onerror = function (msg) { showError(String(msg)); };
    window.addEventListener("unhandledrejection", function (e) { showError(String(e.reason)); });

    var hasWebGL2 = (function () {
      try { var c = document.createElement("canvas"); return !!c.getContext("webgl2"); }
      catch (e) { return false; }
    })();
    if (!hasWebGL2) {
      loading.style.display = "none";
      showError("当前浏览器不支持 WebGL2");
    }

    function unityShowBanner(msg, type) {
      if (type === "error") showError(msg);
      else console.log("[unity]", msg);
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/WebGL.loader.js?v=20261113c";
    var config = {
      dataUrl: buildUrl + "/WebGL.data.unityweb?v=20261113c",
      frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb?v=20261113c",
      codeUrl: buildUrl + "/WebGL.wasm.unityweb?v=20261113c",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "pine813",
      productName: "Zipper Demo",
      productVersion: "1.0",
      showBanner: unityShowBanner,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.75),
    };

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        var p = Math.round(progress * 100);
        fill.style.width = p + "%";
        pct.textContent = p + "%";
      }).then(function (unityInstance) {
        loading.style.display = "none";
        window.unityInstance = unityInstance;
        updateOrientationUi();
      }).catch(function (message) {
        loading.style.display = "none";
        showError(String(message));
      });
    };
    script.onerror = function () {
      loading.style.display = "none";
      showError("游戏资源加载失败（网络或浏览器拦截）");
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
