<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Zipper 閸欏本鐖堕幋蹇庤閼?/title>
<style>
  :root { --bar: 56px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b1220; color: #e8eefc;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; overflow: hidden; }
  #bar { height: var(--bar); display: flex; align-items: center; gap: 14px;
    padding: 0 16px; background: #101a2e; border-bottom: 1px solid #1e2a44; }
  #bar .dot { width: 10px; height: 10px; border-radius: 50%; background: #3b82f6; }
  #bar .dot.done { background: #34d399; }
  #title { font-size: 15px; font-weight: 600; letter-spacing: .3px; }
  #steps { display: flex; gap: 8px; margin-left: 8px; }
  #steps span { font-size: 12px; padding: 3px 10px; border-radius: 999px;
    background: #1b2740; color: #93a5c6; border: 1px solid #26334f; }
  #steps span.active { background: #1d4ed8; border-color: #3b82f6; color: #fff; }
  #steps span.done { background: #0f3d2e; border-color: #34d399; color: #a7f3d0; }
  #spacer { flex: 1; }
  button { font: inherit; font-size: 13px; padding: 8px 14px; border-radius: 8px;
    border: 1px solid #2a3a5c; background: #17233b; color: #dbe6ff; cursor: pointer; }
  button:hover { background: #1e2c49; }
  button.primary { background: #2563eb; border-color: #3b82f6; color: #fff; }
  button.primary:hover { background: #1d4ed8; }
  #stage { position: absolute; top: var(--bar); left: 0; right: 0; bottom: 0;
    width: 100%; height: calc(100% - var(--bar)); border: 0; background: #000; }
  #overlay { position: absolute; inset: var(--bar) 0 0 0; display: none;
    align-items: center; justify-content: center; flex-direction: column; gap: 18px;
    background: radial-gradient(circle at 50% 40%, #14213b, #070c16 70%); z-index: 5; }
  #overlay.show { display: flex; }
  #overlay h1 { margin: 0; font-size: 30px; letter-spacing: 2px; }
  #overlay p { margin: 0; color: #9fb2d4; font-size: 14px; }
  #hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: 18px;
    font-size: 12px; color: #7f92b3; z-index: 6; pointer-events: none; }
</style>
</head>
<body>

<div id="bar">
  <div class="dot" id="dot"></div>
  <div id="title">閸旂姾娴囨稉顓涒偓?/div>
  <div id="steps"></div>
  <div id="spacer"></div>
  <button id="nextBtn" class="primary">闁艾鍙ф禍鍡礉鏉╂稑鍙嗘稉瀣╃娑?閳?/button>
  <button id="restartBtn">闁插秶甯?/button>
</div>

<iframe id="stage" allow="autoplay; fullscreen; gamepad; xr-spatial-tracking"></iframe>

<div id="overlay">
  <h1>閸忋劑鍎撮柅姘彠 棣冨竴</h1>
  <p id="overlayText">娑撱倓閲滃〒鍛婂灆闁棄鐣幋鎰啊</p>
  <button id="againBtn" class="primary">娴犲骸銇旈崘宥嗘降</button>
</div>

<div id="hint">婵″倹鐏夌粭顑跨娑擃亝鐖堕幋蹇曠波閺夌喎鎮楀▽鈩冩箒閼奉亜濮╃捄瀹犳祮閿涘瞼鍋ｉ崣鍏呯瑐鐟欐帇鈧矂鈧艾鍙ф禍鍡礉鏉╂稑鍙嗘稉瀣╃娑擃亗鈧?/div>

<script>
/* ============================================================
   閸欏本鐖堕幋蹇庤閼辨柨顦绘竟?   - 娑撱倓閲?Unity WebGL 閺嬪嫬缂撻崚鍡楀焼閺€鎯ф躬 game-a/ 閸?game-b/
   - 缁楊兛绔存稉顏呯埗閹村繘鈧艾鍙ч崥搴″讲闁俺绻?postMessage 闁氨鐓￠敍灞肩瘍閸欘垱澧滈崝銊у仯閹稿鎸?   - 閺€顖涘瘮 ?game=a / ?game=b 閻╁瓨甯存潻娑樺弳閺屾劒绔村▓?   ============================================================ */
const GAMES = [
  {
    id: 'starry',
    title: '缁楊兛绔寸粩?璺?Starry Abyss 閺勭喍绗傝ぐ鎺椻偓鏃撶礄闂冪喎寮告担婊冩惂閿?,
    src: 'game-a/index.html?v=20261110a'
  },
  {
    id: 'zipper',
    title: '缁楊兛绨╃粩?璺?Zipper閿涙碍鎹ｅú瀣╃瑢閻濆秶褰?,
    src: 'game-b/index.html?v=20261110b'
  }
];

const stage      = document.getElementById('stage');
const titleEl    = document.getElementById('title');
const stepsEl    = document.getElementById('steps');
const dotEl      = document.getElementById('dot');
const overlay    = document.getElementById('overlay');
const overlayTxt = document.getElementById('overlayText');

let index = 0;

function readQuery () {
  const params = new URLSearchParams(location.search);
  const g = (params.get('game') || '').toLowerCase();
  if (g === 'b' || g === 'zipper' || g === '2') return 1;
  if (g === 'a' || g === 'teammate' || g === '1') return 0;
  return 0;
}

function renderSteps () {
  stepsEl.innerHTML = '';
  GAMES.forEach((game, i) => {
    const span = document.createElement('span');
    span.textContent = (i + 1) + '. ' + game.title;
    if (i === index) span.className = 'active';
    else if (i < index) span.className = 'done';
    stepsEl.appendChild(span);
  });
  dotEl.classList.toggle('done', index >= GAMES.length);
}

function load (i) {
  index = i;
  overlay.classList.remove('show');

  if (index >= GAMES.length) {
    dotEl.classList.add('done');
    overlay.classList.add('show');
    overlayTxt.textContent = '娑撱倓閲滃〒鍛婂灆闁棄鐣幋鎰啊閿涘矁闃跨拫銏ｇ槸閻溾晪绱?;
    stage.src = 'about:blank';
    renderSteps();
    return;
  }

  const game = GAMES[index];
  titleEl.textContent = game.title;
  stage.src = game.src;
  document.getElementById('nextBtn').style.display = index < GAMES.length - 1 ? '' : 'none';
  renderSteps();
}

function next () { load(index + 1); }

/* 闁艾鍙ч梻顓犲箚閿涙瓗nity 娓氀嗙殶閻?WebGL 閻?ZipperGameComplete() 娴?postMessage 鏉╁洦娼?*/
window.addEventListener('message', (event) => {
  const data = event.data;
  if (!data) return;

  if (typeof data === 'string' && data === 'game-complete') { next(); return; }
  if (typeof data === 'object' && (data.type === 'game-complete' || data.complete === true)) { next(); }
});

document.getElementById('nextBtn').addEventListener('click', next);
document.getElementById('restartBtn').addEventListener('click', () => load(0));
document.getElementById('againBtn').addEventListener('click', () => load(0));

load(readQuery());
</script>
</body>
</html>
